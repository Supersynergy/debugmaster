name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Syntax checks
        run: |
          python3 -m py_compile bin/debugmaster
          bash -n install.sh bin/debugmaster-scan
          jq empty tools.json debugger-engines.json

      - name: Debugmaster self report
        run: |
          DEBUGMASTER_NO_GREPGOD=1 python3 bin/debugmaster all . \
            --out debugmaster-report \
            --timeout 30

      - name: Upload Debugmaster report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debugmaster-report
          path: |
            debugmaster-report/debugmaster-report.md
            debugmaster-report/debugmaster-report.json
            debugmaster-report/debugmaster-ai-brief.md
