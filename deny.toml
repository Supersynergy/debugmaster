# cargo-deny supply-chain gate. Run: `cargo deny check` (or `just audit`).
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on any RUSTSEC advisory; fail on yanked crates.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Exactly the permissive licenses present in the dependency tree (warning-clean).
# A new dep with a different license will fail CI loudly — add it here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are a warning, not a hard failure.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
