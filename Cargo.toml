[package]
name = "debugmaster"
version = "0.9.3"
edition = "2024"
rust-version = "1.96"
description = "Single-binary bug hunter — static + business-logic detectors over tree-sitter ASTs"
license = "MIT"
repository = "https://github.com/Supersynergy/debugmaster"
homepage = "https://github.com/Supersynergy/debugmaster"
readme = "README.md"
keywords = ["debugging", "static-analysis", "security", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "debugmaster"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tree-sitter = "0.26"
tree-sitter-python = "0.25"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
