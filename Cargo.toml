[package]
name = "debugmaster-rs"
version = "0.1.0"
edition = "2024"
description = "Single-binary bug hunter — static + business-logic detectors over tree-sitter ASTs"
license = "MIT"

[[bin]]
name = "debugmaster"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
